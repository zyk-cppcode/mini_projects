<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交详情 - OnlineOJ</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <div class="top-bar"><h2>提交 #<span id="subId"></span></h2></div>
        <div class="content">
            <div id="subInfo" style="margin-bottom:16px;font-size:0.9em;color:var(--text-muted)"></div>
            <div class="card">
                <h4 style="margin-bottom:8px">代码</h4>
                <pre class="code-block" id="subCode"></pre>
            </div>
            <div class="result-panel" id="subResult"></div>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script>
        const subId = getParam('id');
        async function load() {
            try {
                const s = await api.get(`/api/submissions/${subId}`);
                document.getElementById('subId').textContent = s.id;
                document.getElementById('subInfo').innerHTML = `题目: ${s.problem_id} &nbsp;|&nbsp; 状态: <span style="color:${statusColor(s.status)};font-weight:600">${statusLabel(s.status)}</span> &nbsp;|&nbsp; ${formatDate(s.submitted_at)}`;
                document.getElementById('subCode').textContent = s.code;

                const color = statusColor(s.status);
                let html = `<h4 style="color:${color}">${statusLabel(s.status)}</h4>`;
                html += `<p style="font-size:0.85em;color:var(--text-muted)">通过 ${s.passed_cases}/${s.total_cases}`;
                if (s.time_used_ms) html += ` &nbsp;|&nbsp; 耗时 ${s.time_used_ms}ms`;
                html += `</p>`;

                if ((s.status === 'compilation_error' || s.status === 'system_error') && s.compile_error) {
                    html += `<details><summary style="color:var(--text-secondary)">错误详情</summary><pre>${htmlEscape(s.compile_error)}</pre></details>`;
                }
                if (s.detail) {
                    const d = s.detail;
                    if (d.input_data) html += `<details><summary style="color:var(--text-secondary)">输入</summary><pre>${htmlEscape(d.input_data)}</pre></details>`;
                    if (d.expected_output) html += `<details><summary style="color:var(--text-secondary)">期望输出</summary><pre>${htmlEscape(d.expected_output)}</pre></details>`;
                    if (d.actual_output) html += `<details><summary style="color:var(--text-secondary)">实际输出</summary><pre>${htmlEscape(d.actual_output)}</pre></details>`;
                }
                document.getElementById('subResult').innerHTML = html;
            } catch (err) { showToast(err.message, 'error'); }
        }
        checkAuth().then(() => {
            if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
            renderSidebar(); load();
        });
    </script>
</body>
</html>
