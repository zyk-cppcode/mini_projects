<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人统计 - OnlineOJ</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <div class="top-bar"><h2>个人统计</h2></div>
        <div class="content">
            <div class="card" id="stats"></div>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script>
        async function loadStats() {
            try {
                const s = await api.get('/api/statistics');
                document.getElementById('stats').innerHTML = `
                    <h3>${htmlEscape(getCurrentUser().username)}</h3>
                    <table class="problem-table" style="margin-top:12px">
                        <tbody>
                            <tr><td>已通过</td><td style="color:var(--green);font-weight:700;font-size:1.2em">${s.solved_count}</td></tr>
                            <tr><td>总提交</td><td>${s.total_submissions}</td></tr>
                            <tr><td>通过率</td><td style="color:var(--accent)">${(s.pass_rate*100).toFixed(1)}%</td></tr>
                            <tr><td><span class="diff-badge diff-easy">简单</span></td><td>${s.easy_count}</td></tr>
                            <tr><td><span class="diff-badge diff-medium">中等</span></td><td>${s.medium_count}</td></tr>
                            <tr><td><span class="diff-badge diff-hard">困难</span></td><td>${s.hard_count}</td></tr>
                        </tbody>
                    </table>`;
            } catch (err) { showToast(err.message, 'error'); }
        }
        checkAuth().then(() => {
            if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
            renderSidebar(); loadStats();
        });
    </script>
</body>
</html>
