<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人统计 - OnlineOJ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <main class="container">
        <nav id="navbar"></nav>
        <h3>个人统计</h3>
        <div id="stats"></div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script>
        async function loadStats() {
            try {
                const s = await api.get('/api/statistics');
                document.getElementById('stats').innerHTML = `
                    <table role="grid">
                        <tbody>
                            <tr><td>已通过</td><td><strong>${s.solved_count}</strong></td></tr>
                            <tr><td>总提交</td><td>${s.total_submissions}</td></tr>
                            <tr><td>通过率</td><td>${(s.pass_rate * 100).toFixed(1)}%</td></tr>
                            <tr><td>简单题</td><td>${s.easy_count}</td></tr>
                            <tr><td>中等题</td><td>${s.medium_count}</td></tr>
                            <tr><td>困难题</td><td>${s.hard_count}</td></tr>
                        </tbody>
                    </table>`;
            } catch (err) { showToast(err.message, 'error'); }
        }
        checkAuth().then(() => { renderNavbar(); if (!isLoggedIn()) window.location.href = '/login.html'; loadStats(); });
    </script>
</body>
</html>
