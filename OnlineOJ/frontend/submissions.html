<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交记录 - OnlineOJ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <main class="container">
        <nav id="navbar"></nav>
        <h3>提交记录</h3>
        <div id="loading"></div>
        <table role="grid"><thead><tr><th>#</th><th>题目</th><th>状态</th><th>通过</th><th>耗时</th><th>提交时间</th></tr></thead><tbody id="subTable"></tbody></table>
        <div id="pagination"></div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script>
        let currentPage = 1;
        async function loadSubmissions(page) {
            currentPage = page;
            try {
                const data = await api.get(`/api/submissions?page=${page}&page_size=20`);
                document.getElementById('subTable').innerHTML = data.items.map(s => `
                    <tr>
                        <td><a href="/submission.html?id=${s.id}">${s.id}</a></td>
                        <td>${s.problem_id}</td>
                        <td style="color:${statusColor(s.status)};font-weight:bold">${statusLabel(s.status)}</td>
                        <td>${s.passed_cases}/${s.total_cases}</td>
                        <td>${s.time_used_ms ? s.time_used_ms + 'ms' : '-'}</td>
                        <td>${formatDate(s.submitted_at)}</td>
                    </tr>`).join('');
                document.getElementById('pagination').innerHTML = renderPagination(currentPage, data.total, data.page_size, 'loadSubmissions');
            } catch (err) { showToast(err.message, 'error'); }
        }
        checkAuth().then(() => {
            renderNavbar();
            if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
            loadSubmissions(1);
        });
    </script>
</body>
</html>
