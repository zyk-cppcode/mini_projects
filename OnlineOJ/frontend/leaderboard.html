<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 - OnlineOJ</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <div class="top-bar"><h2>排行榜</h2></div>
        <div class="content">
            <div class="filter-bar">
                <select id="filterDifficulty">
                    <option value="">全部难度</option><option value="easy">简单</option>
                    <option value="medium">中等</option><option value="hard">困难</option>
                </select>
                <select id="filterTag"><option value="">全部标签</option></select>
                <button onclick="loadBoard()">筛选</button>
            </div>
            <table class="problem-table">
                <thead><tr><th style="width:60px">排名</th><th>用户</th><th style="width:80px">通过数</th><th style="width:80px">通过率</th></tr></thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script>
        async function loadBoard() {
            const diff = document.getElementById('filterDifficulty').value;
            const tag = document.getElementById('filterTag').value;
            let url = '/api/leaderboard?';
            if (diff) url += `difficulty=${diff}&`;
            if (tag) url += `tag=${encodeURIComponent(tag)}&`;
            try {
                const data = await api.get(url);
                document.getElementById('boardBody').innerHTML = data.map((e, i) => `
                    <tr>
                        <td class="prob-id">${i + 1}</td>
                        <td><b>${htmlEscape(e.username)}</b></td>
                        <td>${e.solved_count}</td>
                        <td style="color:var(--accent)">${(e.pass_rate * 100).toFixed(1)}%</td>
                    </tr>`).join('') || '<tr><td colspan="4" class="empty-state">暂无数据</td></tr>';
            } catch (err) { showToast(err.message, 'error'); }
        }
        async function loadTags() {
            try {
                const tags = await api.get('/api/admin/tags');
                const sel = document.getElementById('filterTag');
                tags.forEach(t => { const o = document.createElement('option'); o.value = t.name; o.textContent = t.name; sel.appendChild(o); });
            } catch {}
        }
        checkAuth().then(() => {
            if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
            renderSidebar(); loadTags(); loadBoard();
        });
    </script>
</body>
</html>
