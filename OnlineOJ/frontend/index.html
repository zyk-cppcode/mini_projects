<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目列表 - OnlineOJ</title>
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <div id="sidebar"></div>
    <div id="main-content">
        <div class="top-bar"><h2>题目列表</h2></div>
        <div class="content">
            <div class="filter-bar">
                <select id="filterDifficulty">
                    <option value="">全部难度</option>
                    <option value="easy">简单</option>
                    <option value="medium">中等</option>
                    <option value="hard">困难</option>
                </select>
                <select id="filterTag"><option value="">全部标签</option></select>
                <button onclick="loadProblems(1)">筛选</button>
            </div>
            <table class="problem-table">
                <thead><tr><th class="prob-id">#</th><th>标题</th><th>难度</th><th>标签</th></tr></thead>
                <tbody id="problemBody"></tbody>
            </table>
            <div id="pagination"></div>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script>
        let currentPage = 1;
        const diffClass = { easy: 'diff-easy', medium: 'diff-medium', hard: 'diff-hard' };
        const diffName = { easy: '简单', medium: '中等', hard: '困难' };

        async function loadProblems(page) {
            currentPage = page;
            const diff = document.getElementById('filterDifficulty').value;
            const tag = document.getElementById('filterTag').value;
            let url = `/api/problems?page=${page}&page_size=20`;
            if (diff) url += `&difficulty=${diff}`;
            if (tag) url += `&tag=${encodeURIComponent(tag)}`;
            try {
                const data = await api.get(url);
                document.getElementById('problemBody').innerHTML = data.items.map(p => `
                    <tr>
                        <td class="prob-id">${p.id}</td>
                        <td class="prob-title"><a href="/problem.html?id=${p.id}">${htmlEscape(p.title)}</a></td>
                        <td><span class="diff-badge ${diffClass[p.difficulty] || ''}">${diffName[p.difficulty] || p.difficulty}</span></td>
                        <td><div class="prob-tags">${(p.tags||[]).map(t => `<span>${htmlEscape(t)}</span>`).join('')}</div></td>
                    </tr>`).join('') || '<tr><td colspan="4" class="empty-state">暂无题目</td></tr>';
                document.getElementById('pagination').innerHTML = renderPagination(page, data.total, data.page_size, 'loadProblems');
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function loadTags() {
            try {
                const tags = await api.get('/api/admin/tags');
                const sel = document.getElementById('filterTag');
                tags.forEach(t => { const o = document.createElement('option'); o.value = t.name; o.textContent = t.name; sel.appendChild(o); });
            } catch {}
        }

        checkAuth().then(() => {
            if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
            renderSidebar(); loadTags(); loadProblems(1);
        });
    </script>
</body>
</html>
