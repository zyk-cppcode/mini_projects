<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - OnlineOJ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <main class="container">
        <nav id="navbar"></nav>
        <article style="max-width:400px;margin:2rem auto">
            <h3>登录</h3>
            <form id="loginForm">
                <label>用户名 <input type="text" name="username" required autofocus></label>
                <label>密码 <input type="password" name="password" required></label>
                <button type="submit">登录</button>
            </form>
            <p style="margin-top:1rem">还没有账号？<a href="/register.html">注册</a></p>
        </article>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            try {
                await login(fd.get('username'), fd.get('password'));
                window.location.href = '/';
            } catch (err) {
                showToast(err.message, 'error');
            }
        };
        checkAuth().then(u => { if (u) window.location.href = '/'; renderNavbar(); });
    </script>
</body>
</html>
